
on:
  workflow_dispatch:
    inputs:
      root_provider:
        description: "Solución de root"
        type: choice
        options:
          - ksu-next-stable
          - sukisu-ultra-v4.1.3
        default: ksu-next-stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator
          sudo apt-get clean

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libncurses-dev python3 python3-pip zip unzip rsync kmod cpio \
            device-tree-compiler default-jdk git curl patch

      - name: Descargar toolchain (con reintentos)
        run: |
          pip install gdown
          for i in 1 2 3; do
            gdown "https://drive.google.com/uc?id=1um0sIcncTeqVkAE28DwKHlPv1427T5Nb" -O toolchain.tar.gz && break
            sleep 10
          done
          test -s toolchain.tar.gz
          tar -xf toolchain.tar.gz

      - name: Integrar KernelSU-Next
        if: ${{ inputs.root_provider == 'ksu-next-stable' }}
        working-directory: ./kernel-6.6
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
          test -d KernelSU-Next
          sed -i 's/static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          sed -i 's/static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          sed -i 's/static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          echo "KSUN_COMMIT=$(cd KernelSU-Next && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=KSUN" >> "$GITHUB_ENV"

      - name: Integrar SukiSU-Ultra
        if: ${{ inputs.root_provider == 'sukisu-ultra-v4.1.3' }}
        working-directory: ./kernel-6.6
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          test -d KernelSU/kernel
          echo "SUKISU_COMMIT=$(cd KernelSU && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=SKSU" >> "$GITHUB_ENV"

      - name: Fijar restricciones del compilador Clang
        working-directory: ./kernel-6.6
        run: |
          sed -i '1i #pragma GCC diagnostic ignored "-Warray-bounds"' include/linux/signal.h
          for selinux_file in "KernelSU/kernel/feature/selinux_hide.c" "KernelSU-Next/kernel/feature/selinux_hide.c"; do
            if [ -f "$selinux_file" ]; then
              sed -i '1i #pragma GCC diagnostic ignored "-Wpointer-bool-conversion"' "$selinux_file"
            fi
          done

      - name: Habilitar CONFIG_KSU en overlay
        run: |
          CFG=$(grep -rl "CONFIG_KSU" --include="*.config" . 2>/dev/null | head -n1)
          if [ -z "$CFG" ]; then
            CFG="./kernel/kernel_device_modules-6.6/kernel/configs/mt6768_overlay.config"
          fi
          if ! grep -q "CONFIG_KSU=y" "$CFG"; then
            echo "CONFIG_KSU=y" >> "$CFG"
          fi
          cat <<EOF >> "$CFG"
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          # Disable Samsung Knox/DEFEX in mediatek-bazel_defconfig
          DEFEX_CFG="./kernel/kernel_device_modules-6.6/arch/arm64/configs/mediatek-bazel_defconfig"
          if [ -f "$DEFEX_CFG" ]; then
            sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/' "$DEFEX_CFG"
            sed -i 's/CONFIG_SECURITY_DEFEX_USER=y/# CONFIG_SECURITY_DEFEX_USER is not set/' "$DEFEX_CFG"
          fi

      - name: Cache de Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-cache-${{ runner.os }}-${{ inputs.root_provider }}-${{ hashFiles('kernel/WORKSPACE') }}

      - name: Compilar
        run: |
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a05m-kernel-${{ inputs.root_provider }}-${{ github.run_number }}
          path: "*.zip"
          retention-days: 14
